[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "TRY", "DTZ", "ASYNC", "TCH"]
ignore = [
    "BLE001",
    "N999",
    "DTZ005",
    "DTZ007",
    "S110",
    "S311",
    "SIM112",
    "E402",
    "S603",
    "S606",
    "S607",
    "TRY003",
    "TRY300",
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
